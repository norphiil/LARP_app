networks:
  larp-network:
    driver: bridge
  traefik_default:
    external: true

volumes:
  larp-data:
    driver: local
  larp-logs:
    driver: local

services:
  larpapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: larp-api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=${HOST:-0.0.0.0}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - DATABASE_PATH=/app/data/database.db
    volumes:
      - larp-data:/app/data
      - larp-logs:/app/logs
    networks:
      - larp-network
      - traefik_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.larpapp.rule=Host(`larp.voulkai.nocturlab.fr`)"
      - "traefik.http.services.larpapp.loadbalancer.server.port=3000"
